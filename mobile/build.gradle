dependencies {
    testImplementation project(':common')
    testImplementation project(':api')

    testImplementation platform('org.seleniumhq.selenium:selenium-bom:4.22.0')
    testImplementation 'org.seleniumhq.selenium:selenium-java'
    testImplementation "io.appium:java-client:$appiumVersion"
}

task android(type: Test) {
    useJUnitPlatform { includeTags("android") }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'mobile.provider', 'browserstack'
    systemProperties System.getProperties()

    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
}

task androidLocal(type: Test) {
    useJUnitPlatform { includeTags("android") }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'mobile.provider', 'local'
    systemProperties System.getProperties()

    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'

    outputs.upToDateWhen { false }
}
