# Тестируемое приложение
base.url=https://app.todoist.com
api.url=https://api.todoist.com
api.version=/api/v1

# Web (Selenide)
browser=CHROME
browser.size=1920x1080
is.remote=false
web.timeout.ms=15000
web.headless=true
web.page.load.strategy=eager
# remote.url=
# browser.version=

# API-моки (WireMock)
mock.test.token=test_local_token_secure_123
mock.invalid.token=invalid_token_xyz_999

# Mobile: приложение и Appium
mobile.provider=local
app.package=com.todoist
app.activity=com.todoist.activity.HomeActivity
device.timezone=Europe/Moscow
local.apk.path=src/test/resources/apps/todoist.apk

# Mobile: BrowserStack
bs.device=Samsung Galaxy S23
bs.os.version=13.0
bs.timezone=Moscow
bs.project.name=Todoist Mobile Automation
bs.build.name=Diploma_Mobile_Build
