name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API-тесты (WireMock + live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: Запуск :api:test
        run: ./gradlew :api:test

      - name: Сохранить результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: |
            allure-results
            api/build/allure-results
          if-no-files-found: warn
          retention-days: 7

  db:
    name: DB-тесты (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: todoist-real-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: Запуск :db:test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: ./gradlew :db:test "-Dapi.token=$API_TOKEN"

      - name: Скрыть токен в результатах Allure
        if: always()
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then grep -rIlF "$API_TOKEN" allure-results db/build/allure-results 2>/dev/null | xargs -r sed -i "s|$API_TOKEN|***|g" || true; fi

      - name: Сохранить результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-db
          path: |
            allure-results
            db/build/allure-results
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web-тесты (Selenide)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: Запуск :web:test
        env:
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: ./gradlew :web:test "-Dapi.token=$API_TOKEN"

      - name: Скрыть токен в результатах Allure
        if: always()
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then grep -rIlF "$API_TOKEN" allure-results web/build/allure-results 2>/dev/null | xargs -r sed -i "s|$API_TOKEN|***|g" || true; fi

      - name: Сохранить результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: |
            allure-results
            web/build/allure-results
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Allure-отчёт на GitHub Pages
    needs: [ api, db, web ]
    if: |
      always() && 
      github.event_name != 'pull_request' && 
      (needs.api.result == 'success' || needs.api.result == 'failure') &&
      (needs.db.result == 'success' || needs.db.result == 'failure') &&
      (needs.web.result == 'success' || needs.web.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: allure-results-*

      - name: Собрать результаты в одну папку
        run: |
          mkdir -p merged-results
          find artifacts -type d -name allure-results | while read -r d; do
            cp -r "$d"/. merged-results/
          done
          echo "Файлов результатов: $(ls merged-results | wc -l)"

      - name: Кэш Allure CLI
        id: cache-allure
        uses: actions/cache@v4
        with:
          path: ~/allure-2.27.0
          key: allure-cli-2.27.0

      - name: Установить Allure CLI
        if: steps.cache-allure.outputs.cache-hit != 'true'
        run: |
          curl -sLo allure.zip https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.27.0/allure-commandline-2.27.0.zip
          unzip -q allure.zip -d "$HOME"

      - name: Добавить Allure CLI в PATH
        run: echo "$HOME/allure-2.27.0/bin" >> "$GITHUB_PATH"

      - name: Сгенерировать отчёт
        run: allure generate merged-results -o allure-report --clean

      - name: Отправить уведомление в Telegram
        uses: qa-guru/allure-notifications@v6
        if: always()
        with:
          config: 'allure-notifications-config.json'
          allure-folder: 'allure-report'
          mode: 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
          name: github-pages

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
